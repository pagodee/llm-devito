# Configuração do agente de teste, aplicada sobre o perfil "headless" do dsh
# com --patch. É um MODELO: os scripts de execução trocam @MODEL@, @BASE_URL@
# e @CONTEXT_LENGTH@ e salvam o resultado na home do container.
#
# O agente tem uma única ferramenta, simulate_projectile (projectile_server.py).
# Ele existe para testar o caminho completo dentro dos containers:
#   modelo -> dsh -> ferramenta MCP (Python) -> resultado -> resposta.

# 1. O modelo: o servidor com API compatível com a da OpenAI em @BASE_URL@.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      gpt:
        displayName: gpt
        api: openai-completions
        baseURL: '@BASE_URL@'
        models:
          - id: '@MODEL@'
            name: gpt
            # O mesmo contexto do servidor. Sem isto o dsh suporia o máximo do
            # modelo (262144 tokens no qwen3), maior que o carregado pelo Ollama,
            # e numa conversa longa o começo seria cortado sem aviso.
            contextWindow: @CONTEXT_LENGTH@
        apiKeyEnv: GPT_API_KEY

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: gpt
    model: '@MODEL@'

# 2. Sem título automático: o dsh pediria ao modelo um título para cada sessão,
#    uma chamada extra que custa cerca de 1 minuto na CPU.
- { id: session-title-llm, disabled: true }

# 3. As instruções. Ficam em inglês porque são lidas pelo modelo, e modelos
#    pequenos seguem instruções em inglês com mais precisão. O agente responde
#    no idioma da pergunta.
- id: system-prompt
  config:
    personaPrefix: >-
      You are a physics assistant for an undergraduate research project on
      modelling physical phenomena, powered by the {{model}} model. Answer
      quantitative questions about projectile motion by running numerical
      experiments with the simulate_projectile tool; never estimate numbers by
      hand when the tool can compute them. In every answer state the model
      equation, the parameters you used, the numbers the tool returned, the
      integrator check, and a short physical interpretation. Answer in the
      language the user writes in.

# 4. Sem shell, arquivos, web etc.: a ferramenta de física é a única ação.
- { id: tool-bash, disabled: true }
- { id: tool-pwsh, disabled: true }
- { id: tool-jobs, disabled: true }
- { id: tool-fs, disabled: true }
- { id: tool-fs-search, disabled: true }
- { id: tool-web, disabled: true }
- { id: tool-todo, disabled: true }
- { id: tool-goal, disabled: true }
- { id: tool-skill, disabled: true }
- { id: tool-workflow, disabled: true }
- { id: tool-subagent, disabled: true }
- { id: tool-subagent-fork, disabled: true }
- { id: tool-subagent-control, disabled: true }
- { id: tool-subagent-list-agents, disabled: true }
- { id: tool-plugin-manager, disabled: true }
- { id: tool-working-directory, disabled: true }
# Estes dois também expõem ferramentas ao modelo: exit_plan_mode (fica
# registrada mesmo fora do modo de planejamento) e as de recursos MCP
# (list_mcp_resources etc., que aparecem quando há um servidor MCP).
- { id: plan-mode, disabled: true }
- { id: mcp-resources, disabled: true }

# 5. A ferramenta, lida da pasta agent/ montada em /agent (somente leitura).
- insert:
    - id: mcp-physics
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: physics
        transport: stdio
        command: /usr/bin/python3
        args: [/agent/projectile_server.py]
        failOnStartupError: true
